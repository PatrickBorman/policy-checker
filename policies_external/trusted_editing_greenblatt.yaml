name: trusted_editing_greenblatt
description: A protocol for code generation where a trusted model edits untrusted output, with auditing and selection
  based on suspicion levels.
provenance: extracted by gemini-3.1-flash-lite from sources/ai_control_protocols.txt; verbatim source in that file
env:
- name: suspicion_top_2_percent
  desc: The code generated by U is in the top 2 percent most suspicious.
- name: suspicion_top_20_percent
  desc: The code generated by U is in the top 20 percent most suspicious.
sys:
- name: audit
  desc: The controller chooses to audit the code.
- name: use_edited_solution
  desc: The controller chooses to use the solution edited by T.
- name: use_u_solution
  desc: The controller chooses to use the solution generated by U.
rules:
- id: audit_rule
  text: If the code is in the top 2 percent most suspicious, the controller must audit.
  source: Audit the top 2% most suspicious U code
  ambiguity: The protocol does not specify what happens if the audit fails or what the audit action entails.
- id: edited_solution_rule
  text: If the code is between the top 2 percent and top 20 percent most suspicious, the controller must use the
    edited solution.
  source: use an edited solution for suspicion between the top 2% and top 20%
  ambiguity: None.
- id: u_solution_rule
  text: If the code is in the bottom 80 percent most suspicious, the controller must use U's solution.
  source: use U's solution for suspicion in the bottom 80%
  ambiguity: None.
- id: mutual_exclusivity
  text: The controller chooses exactly one of audit, use_edited_solution, or use_u_solution per proposal.
  source: choose between U's solution, the edited solution, and audit
  ambiguity: None.
