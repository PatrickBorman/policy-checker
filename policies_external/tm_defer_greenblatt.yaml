name: tm_defer_greenblatt
description: A control protocol that routes each output of U by either submitting U's code, submitting T's code,
  auditing, or shutting down based on suspiciousness evaluations.
provenance: extracted by gemini-3.5-flash from sources/ai_control_protocols.txt; verbatim source in that file
env:
- name: suspicious_below_threshold
  desc: The suspiciousness of U's code is below the threshold for submission.
- name: top_2_percent
  desc: The code is in the top 2% most suspicious code written by U.
- name: more_suspicious_than_expected
  desc: The untrusted model produces significantly more suspicious solutions than expected.
sys:
- name: submit_u
  desc: Submit U's code.
- name: submit_t
  desc: Produce code using T and submit that.
- name: audit
  desc: Audit the code.
- name: shutdown
  desc: Shut down the system.
rules:
- id: exclusivity
  text: The controller does exactly one of its actions per step.
  source: routes each output of U (submit U's code / submit T's code / audit / shut down)
  ambiguity: The text does not explicitly state that these actions are mutually exclusive, but the routing context
    implies it.
- id: shutdown_rule
  text: If the untrusted model produces significantly more suspicious solutions than expected, the controller must
    shut down.
  source: we avoid this by shutting down if the untrusted model produces significantly more suspicious solutions
    than expected.
  ambiguity: It is not specified whether shutdown takes precedence over auditing.
- id: audit_rule
  text: If the code is in the top 2% most suspicious code written by U and the controller does not shut down, the
    controller must audit.
  source: Audit the top 2% most suspicious code written by U.
  ambiguity: The text does not clarify how the top 2% threshold relates to the submission threshold, or if auditing
    takes precedence over submission.
- id: submit_u_rule
  text: If the controller does not shut down and does not audit, and the suspiciousness is below the threshold,
    the controller must submit U's code.
  source: Submit that code if its suspiciousness is below a certain threshold
  ambiguity: The exact relationship and priority between the submission threshold and the 2% audit threshold are
    not defined.
- id: submit_t_rule
  text: If the controller does not shut down and does not audit, and the suspiciousness is not below the threshold,
    the controller must submit T's code.
  source: otherwise produce code using T and submit that.
  ambiguity: The text does not specify if T's code can also be audited or if it is trusted by default.
