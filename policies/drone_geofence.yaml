name: drone_geofence
description: >
  Flight rules for a delivery drone: geofence boundary, wind, GPS loss.
provenance: modelled on UAS geofence and lost-link contingency rules
env:
  - {name: near_boundary, desc: the drone is near the geofence boundary}
  - {name: wind_high, desc: wind exceeds the hover limit}
  - {name: gps_lost, desc: GPS fix is lost}
sys:
  - {name: continue, desc: continue on course}
  - {name: hover, desc: hold position}
  - {name: land, desc: land immediately}
rules:
  - id: G1
    kind: guarantee
    text: In every step exactly one of continue, hover or land is chosen.
    spectra:
      - "G (continue | hover | land)"
      - "G (!(continue & hover) & !(continue & land) & !(hover & land))"
  - id: G2
    kind: guarantee
    text: Never continue without GPS or near the boundary.
    spectra:
      - "G (gps_lost -> !continue)"
      - "G (near_boundary -> !continue)"
  - id: G3
    kind: guarantee
    text: Never hover in high wind.
    spectra: "G (wind_high -> !hover)"
  - id: G4
    kind: guarantee
    text: With GPS and clear of the boundary, in calm wind, the drone continues.
    spectra: "G ((!gps_lost & !near_boundary & !wind_high) -> continue)"
