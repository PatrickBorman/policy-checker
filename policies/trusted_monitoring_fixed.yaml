name: trusted_monitoring_fixed
description: >
  Trusted monitoring with defer-to-trusted, as described in the AI-control literature: audit flagged outputs
  while budget remains, otherwise replace them with the trusted model's output. Written with the protocol's
  own assumption that the trusted model is always available.
provenance: modelled on Greenblatt et al. 2023, "AI Control", trusted monitoring + defer-to-trusted
env:
  - {name: output_ready, desc: the untrusted model has produced an output this step}
  - {name: flagged, desc: the monitor flags the output as suspicious}
  - {name: budget_exhausted, desc: the human audit budget is exhausted}
  - {name: trusted_available, desc: the trusted model can take over}
sys:
  - {name: use_untrusted, desc: ship the untrusted output}
  - {name: defer_trusted, desc: replace with the trusted model's output}
  - {name: audit, desc: send to a human auditor}
rules:
  - id: G1
    kind: guarantee
    text: Every output is routed in the same step to exactly one of use_untrusted, defer_trusted or audit; nothing is routed when there is no output.
    spectra:
      - "G (output_ready -> (use_untrusted | defer_trusted | audit))"
      - "G (!(use_untrusted & defer_trusted) & !(use_untrusted & audit) & !(defer_trusted & audit))"
      - "G (!output_ready -> (!use_untrusted & !defer_trusted & !audit))"
  - id: G2
    kind: guarantee
    text: Never ship a flagged output.
    spectra: "G ((output_ready & flagged) -> !use_untrusted)"
  - id: G3
    kind: guarantee
    text: A flagged output is audited while the audit budget remains.
    spectra: "G ((output_ready & flagged & !budget_exhausted) -> audit)"
  - id: G4
    kind: guarantee
    text: Once the budget is exhausted, flagged outputs are deferred to the trusted model instead of audited.
    spectra:
      - "G ((output_ready & flagged & budget_exhausted) -> defer_trusted)"
      - "G (budget_exhausted -> !audit)"
  - id: A1
    kind: assumption
    text: The trusted model is always available.
    spectra: "G (trusted_available)"
