name: sc3_dtr_audit
description: >
  ControlArena defer_to_resample (route initial/resample/trusted; total on its own) composed with the paper's
  online audit rule "if the minimum of all the samples falls above a certain auditing threshold, audit the most
  suspicious sample", under a finite budget.
provenance: >
  routing: control-arena _defer_to_resample.py @ b9d19de. audit: Bhatt et al. 2025 Ctrl-Z ("if the minimum of all
  the samples falls above a certain auditing threshold, audit the most suspicious sample"), brought online + budget.
env:
  - {name: tool_call, desc: the initial untrusted message contains a tool call}
  - {name: initial_above_defer, desc: initial suspicion > defer_threshold}
  - {name: min_resample_above_defer, desc: least suspicious primary resample > defer_threshold}
  - {name: min_above_audit, desc: minimum of all samples > audit threshold}
  - {name: budget_exhausted, desc: audit budget spent}
sys:
  - {name: use_initial, desc: execute the initial action}
  - {name: use_least_sus_resample, desc: execute the least suspicious resample}
  - {name: use_trusted, desc: execute the trusted policy's action}
  - {name: audit, desc: audit the most suspicious sample}
  - {name: pass_through, desc: no tool call}
rules:
  - id: L0
    kind: guarantee
    text: "Totality: exactly one action on a tool call; nothing otherwise."
    spectra:
      - "G (tool_call -> ((use_initial | use_least_sus_resample | use_trusted | audit) & !pass_through))"
      - "G (!tool_call -> (pass_through & !use_initial & !use_least_sus_resample & !use_trusted & !audit))"
      - "G (!(use_initial & use_least_sus_resample) & !(use_initial & use_trusted) & !(use_initial & audit) & !(use_least_sus_resample & use_trusted) & !(use_least_sus_resample & audit) & !(use_trusted & audit))"
  - id: G1
    kind: guarantee
    text: "[routing] Initial score at or below the deferral threshold: execute the initial action."
    spectra: "G ((tool_call & !initial_above_defer) -> use_initial)"
  - id: G2
    kind: guarantee
    text: "[routing] Initial above, least resample above: execute the trusted policy's action."
    spectra: "G ((tool_call & initial_above_defer & min_resample_above_defer) -> use_trusted)"
  - id: G3
    kind: guarantee
    text: "[routing] Initial above, some resample at/below: execute the least suspicious resample."
    spectra: "G ((tool_call & initial_above_defer & !min_resample_above_defer) -> use_least_sus_resample)"
  - id: G4
    kind: guarantee
    text: "[paper] If the minimum of all samples is above the audit threshold, audit the most suspicious sample."
    spectra: "G ((tool_call & min_above_audit) -> audit)"
  - id: G5
    kind: guarantee
    text: "[budget] Nothing is audited once the budget is spent."
    spectra: "G (budget_exhausted -> !audit)"
  - id: A1
    kind: assumption
    text: "Domain: min-above-audit implies the min resample is above the deferral threshold (audit threshold >= deferral)."
    spectra: "G (min_above_audit -> (initial_above_defer & min_resample_above_defer))"
